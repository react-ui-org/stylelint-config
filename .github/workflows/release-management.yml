name: Release Management

on:
  push:
    branches: [ master ]

permissions:
  contents: read
  id-token: write

# Kept in sync with test.yml.
env:
  NODE_VERSION: '24.20'
  NPM_VERSION: 11.19.0

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check_package_version.outputs.version }}
      version_changed: ${{ steps.check_package_version.outputs.changed }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm@${{ env.NPM_VERSION }}
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check package.json for version change
        id: check_package_version
        uses: EndBug/version-check@v2

      - name: Log when version changed
        if: steps.check_package_version.outputs.changed == 'true'
        run: 'echo "Version change found in commit ${{ steps.check_package_version.outputs.commit }}! New version: ${{ steps.check_package_version.outputs.version }} (${{ steps.check_package_version.outputs.type }})"'

      - name: Log when version unchanged
        if: steps.check_package_version.outputs.changed == 'false'
        run: 'echo "No version change"'

  update_release_draft:
    name: Update release draft
    permissions:
      contents: write
    needs: [test]
    if: needs.test.outputs.version_changed == 'false'
    runs-on: ubuntu-24.04
    steps:
      - name: Draft release on GitHub
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_release_draft_on_version_bump:
    name: Publish release draft
    permissions:
      contents: write
    needs: [test]
    if: needs.test.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      # An existing release draft is published only if there is a version bump in `package.json`.
      # Throws an error and breaks the job if called regardless. We check for version changes in the
      # `test` job first so this job is skipped rather than exited with an error.
      - name: Publish matching GitHub release draft
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "v${{ needs.test.outputs.version }}" &>/dev/null
          then
            gh release create "v${{ needs.test.outputs.version }}" --draft --title "v${{ needs.test.outputs.version }}"
          fi
          gh release edit "v${{ needs.test.outputs.version }}" --draft=false
          echo "release_url=$(gh release view "v${{ needs.test.outputs.version }}" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: Write out the release URL
        run: echo "Released at $RELEASE_URL"
        env:
          RELEASE_URL: ${{ steps.github_release.outputs.release_url }}

  publish_package_to_npm:
    name: Publish to npm
    needs: [test, publish_release_draft_on_version_bump]
    if: needs.test.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install npm@${{ env.NPM_VERSION }}
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install
        run: npm ci

      - name: Publish to npm
        run: npm publish --provenance
